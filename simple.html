<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kentälliset Simple – Nopea kokoonpano & Live</title>
    
    <!-- Web App & PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1120">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="simple.css?v=1.1">

    <!-- Firebase SDK (for automatic background sync) -->
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- HEADER -->
    <header class="simple-header">
        <div class="header-left">
            <div class="team-logo-badge" id="team-logo-badge">🏑</div>
            <select class="team-select" id="simple-team-select"></select>
        </div>
        <div class="header-right">
            <button class="btn-header" id="btn-simple-refresh" title="Päivitä">🔄</button>
            <a href="index.html" class="btn-header highlight" title="Siirry laajempaan taktiseen fläppitauluun">🎨 Taktinen tila</a>
        </div>
    </header>

    <!-- EVENT BAR & ATTENDANCE STATS -->
    <div class="event-bar">
        <div class="event-row">
            <select class="event-select" id="simple-event-select"></select>
            <button class="btn-header highlight" id="btn-simple-fetch-events" title="Hae tapahtumat verkosta (Nimenhuuto / myClub)">🔄 Hae</button>
            <button class="btn-header" id="btn-simple-config-events" title="Aseta Nimenhuuto/myClub -linkki">⚙️</button>
        </div>
        <div class="stats-bar" id="simple-stats-bar">
            <!-- Dynamic attendance stat chips -->
        </div>
    </div>

    <!-- LINEUP TABS -->
    <nav class="lineup-nav-bar" id="lineup-nav-bar">
        <!-- Dynamic Lineup Tabs -->
    </nav>

    <!-- MAIN CONTENT -->
    <main class="simple-content">
        <!-- LINEUP CARDS -->
        <div id="lineup-card-container">
            <!-- Dynamic Lineup Card with Slots -->
        </div>

        <!-- QUICK ACTIONS ROW -->
        <div class="tools-row">
            <button class="btn-tool primary" id="btn-copy-wa">
                <span>📋 Kopioi WhatsAppiin</span>
            </button>
        </div>

        <!-- LIVE ROSTER BANK -->
        <div class="roster-card">
            <div class="roster-card-header">
                <div class="roster-title">👥 Pelaajat & Live-status</div>
            </div>
            <div class="player-list" id="simple-roster-list">
                <!-- Dynamic Player Rows -->
            </div>
        </div>
    </main>

    <!-- BOTTOM SHEET / MODAL PICKER -->
    <div class="simple-modal" id="simple-modal">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Valitse pelaaja</div>
                <button class="btn-modal-close" id="btn-modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic picker options -->
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="simple-toast" id="simple-toast"></div>

    <!-- Firebase Config & App Engine -->
    <script src="firebase-config.js"></script>
    <script src="simple.js?v=1.1"></script>

</body>
</html>
