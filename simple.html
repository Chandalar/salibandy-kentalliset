<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kentälliset Simple – Nopea kokoonpano & Live</title>
    
    <!-- Web App & PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1120">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="simple.css?v=53.0">

    <script>
    (function() {
        try {
            const params = new URLSearchParams(window.location.search);
            if (params.get('mode') === 'simple') {
                localStorage.setItem('salibandy_app_mode', 'simple');
            }
        } catch(e) {}
    })();
    </script>
</head>
<body>

    <!-- HEADER -->
    <header class="simple-header">
        <div class="header-left">
            <div class="team-logo-badge" id="team-logo-badge">🏑</div>
            <select class="team-select" id="simple-team-select"></select>
        </div>
        <div class="header-right">
            <button class="btn-header" id="btn-simple-refresh" title="Päivitä">🔄</button>
            <a href="index.html?mode=advanced" class="btn-header highlight" title="Siirry taktiseen fläppitauluun (Advanced)">🎨 Taktinen fläppitaulu</a>
        </div>
    </header>

    <!-- EVENT BAR & ATTENDANCE STATS -->
    <div class="event-bar">
        <div class="event-row">
            <select class="event-select" id="simple-event-select"></select>
            <button class="btn-header highlight" id="btn-open-sync-modal" title="Hae tapahtumat verkosta (Nimenhuuto / myClub)">🔄 Hae</button>
            <button class="btn-header" id="btn-open-sync-settings" title="Aseta Nimenhuuto/myClub -osoite">⚙️</button>
        </div>
        <div class="stats-bar" id="simple-stats-bar">
            <!-- Dynamic attendance stat chips -->
        </div>
    </div>

    <!-- LINEUP TABS -->
    <nav class="lineup-nav-bar" id="lineup-nav-bar">
        <!-- Dynamic Lineup Tabs -->
    </nav>

    <!-- MAIN CONTENT -->
    <main class="simple-content">
        <!-- LINEUP CARDS (Responsive multi-column grid on wide screens) -->
        <div id="lineup-card-container">
            <!-- Dynamic Lineup Card with Slots -->
        </div>

        <!-- QUICK ACTIONS ROW -->
        <div class="tools-row">
            <button class="btn-tool primary" id="btn-copy-wa">
                <span>📋 Kopioi WhatsAppiin</span>
            </button>
        </div>

        <!-- LIVE ROSTER BANK -->
        <div class="roster-card">
            <div class="roster-card-header">
                <div class="roster-title">👥 Pelaajat & Live-status</div>
            </div>
            <div class="player-list" id="simple-roster-list">
                <!-- Dynamic Player Rows -->
            </div>
        </div>
    </main>

    <!-- EVENT SYNC / FETCH MODAL -->
    <div class="simple-modal" id="event-sync-modal">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title">🔄 Tapahtumat & Ilmoittautumiset</div>
                <button class="btn-modal-close" id="btn-close-sync-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 6px;">
                    Hae ottelut, treenit ja ilmoittautuneet pelaajat Nimenhuudosta tai myClubista:
                </p>
                <div style="display: flex; gap: 6px; margin-bottom: 12px;">
                    <input type="url" id="input-sync-url" class="team-select" style="flex: 1; max-width: none; font-size: 0.88rem;" placeholder="https://sekta.nimenhuuto.com/events">
                    <button class="btn-header highlight" id="btn-do-fetch-events" style="padding: 10px 16px; font-size: 0.88rem;">🔄 Hae</button>
                </div>
                
                <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 8px;">
                    <div style="font-weight: 700; font-size: 0.88rem; color: #fff; margin-bottom: 4px;">Tai liitä lista suoraan leikepöydältä:</div>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px;">
                        Kopioi teksti Nimenhuudosta, myClubista tai WhatsAppista ja liitä tähän:
                    </p>
                    <textarea id="input-paste-attendance" style="width: 100%; height: 110px; background: #0b1120; color: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; font-family: monospace; font-size: 0.8rem; resize: vertical;" placeholder="Esim:&#10;In (12): #4 Männistö, #33 Sivil, #10 Virtanen...&#10;Out (3): #88 Laakso..."></textarea>
                    <button class="btn-tool primary" id="btn-do-paste-attendance" style="margin-top: 8px; width: 100%;">📋 Tallenna liitetty lista</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM SHEET / MODAL PICKER -->
    <div class="simple-modal" id="simple-modal">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Valitse pelaaja</div>
                <button class="btn-modal-close" id="btn-modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic picker options -->
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="simple-toast" id="simple-toast"></div>

    <!-- Firebase Config & App Engine -->
    <script src="firebase-config.js?v=53.0"></script>
    <script src="simple.js?v=53.0"></script>

</body>
</html>
